<svg xmlns="http://www.w3.org/2000/svg" width="860" height="330" viewBox="0 0 860 330" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .mono { font-family: 'Fira Code', 'JetBrains Mono', 'Cascadia Code', Consolas, 'Courier New', monospace; font-size: 16px; }
    .prompt { fill: #9ece6a; }
    .path { fill: #7aa2f7; }
    .cmd { fill: #c0caf5; }
    .out { fill: #a9b1d6; }
    .hl { fill: #bb9af7; font-weight: 600; }
    .accent { fill: #7dcfff; }
    .muted { fill: #565f89; }
    .line { opacity: 0; animation: show 0.35s ease forwards; }
    .l1 { animation-delay: 0.3s; }
    .l2 { animation-delay: 1.0s; }
    .l3 { animation-delay: 1.7s; }
    .l4 { animation-delay: 2.3s; }
    .l5 { animation-delay: 2.7s; }
    .l6 { animation-delay: 3.4s; }
    .l7 { animation-delay: 4.0s; }
    .l8 { animation-delay: 4.7s; }
    .cursor { opacity: 0; animation: show 0.1s 5.2s forwards, blink 1s 5.3s step-end infinite; }
    @keyframes show { to { opacity: 1; } }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
  </style>

